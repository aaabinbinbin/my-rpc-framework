# Common
rpc.transport=netty
rpc.serializer=protobuf
rpc.loadbalancer=random

# Registry
rpc.registry.type=zookeeper
rpc.registry.address=127.0.0.1:2181
rpc.registry.timeout=5000

# Provider
rpc.server.host=127.0.0.1
rpc.server.port=8080
rpc.server.scanPackages=
rpc.server.autoRegisterAnnotatedServices=true
rpc.server.bossThreads=1
rpc.server.workerThreads=4
rpc.server.biz.coreThreads=4
rpc.server.biz.maxThreads=8
rpc.server.biz.queueCapacity=1000
rpc.server.rateLimit.enabled=false
rpc.server.rateLimit.permitsPerSecond=200
rpc.server.degradation.enabled=false
rpc.server.degradation.policy=failFast
# rpc.server.degradation.defaultValue.com.rpc.HelloService#sayHello=provider-default
rpc.server.shutdownTimeout=10
rpc.server.readerIdleTime=30000
rpc.server.writerIdleTime=0
rpc.server.allIdleTime=0

# Consumer
rpc.client.connectTimeout=5000
rpc.client.readTimeout=10000
rpc.client.heartbeatInterval=30000
rpc.client.writerIdleTime=30000
rpc.client.readerIdleTime=10000
rpc.client.retryTimes=3
rpc.client.cluster=failover
rpc.client.methods=
# rpc.client.method.fastHello.service=com.rpc.HelloService
# rpc.client.method.fastHello.method=sayHello
# rpc.client.method.fastHello.retryTimes=0
# rpc.client.method.fastHello.cluster=failfast
# rpc.client.method.fastHello.readTimeout=500
# rpc.client.method.fastHello.serializer=json
# rpc.client.method.fastHello.loadBalancer=roundRobin
# rpc.client.method.fastHello.rateLimitEnabled=true
# rpc.client.method.fastHello.rateLimitPermitsPerSecond=10
# rpc.client.method.fastHello.circuitBreakerScope=method
rpc.client.reconnect.enabled=true
rpc.client.reconnect.maxRetryTimes=5
rpc.client.reconnect.initialDelaySeconds=2
rpc.client.reconnect.maxDelaySeconds=60
rpc.client.reconnect.jitter.enabled=true
rpc.client.reconnect.jitter.minSeconds=0
rpc.client.reconnect.jitter.maxSeconds=1
rpc.client.discovery.preheat.enabled=false
rpc.client.discovery.preheat.services=
rpc.client.discovery.cacheTtlMillis=30000
rpc.client.discovery.allowStaleOnFailure=true
rpc.filter.consumer=trace,mdc,consumerMetrics
rpc.filter.invoker=consumerCircuitBreaker
rpc.filter.provider=providerRateLimit,providerMdc,providerMetrics
# rpc.filter.order.providerRateLimit=5
rpc.client.degradation.policy=failFast
# rpc.client.degradation.defaultValue.com.rpc.HelloService#sayHello=consumer-default
rpc.client.enableDegradation=false
rpc.client.degradationFailureThreshold=10
rpc.client.rateLimit.enabled=false
rpc.client.rateLimit.permitsPerSecond=100
rpc.client.circuitBreaker.failureRateThreshold=50
rpc.client.circuitBreaker.minNumberOfCalls=10
rpc.client.circuitBreaker.waitDurationInOpenStateMillis=30000
rpc.client.circuitBreaker.permittedHalfOpenCalls=5
